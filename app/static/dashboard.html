<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141b1e">
<title>Billow - demo dashboard</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <h1>Billow demo dashboard</h1>
    <div class="bar-end">
      <span class="synthetic" lang="en" dir="ltr">SYNTHETIC DEMO</span>
    </div>
  </div>
</header>
<main id="main" class="w-wide">
  <div class="card-main stack-8">
    <p class="panel">Demo dashboard - synthetic data only. Counts since the last server restart; any count under 10 is shown as &lt;10. No personal data is kept.</p>
    <p><button type="button" id="refresh" class="primary">Refresh</button></p>
    <p id="since" class="muted"></p>
    <section id="counts" class="stack-3"></section>
    <section id="languages" class="stack-3"></section>
    <section id="rules" class="stack-3"></section>
  </div>
</main>
<script src="dashboard.js"></script>
</body>
</html>
