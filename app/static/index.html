<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141b1e">
<title>Billow</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="bar">
  <div class="bar-in">
    <h1 id="app-title"></h1>
    <div class="bar-end">
      <button type="button" id="theme-btn" class="ghost sm"></button>
      <span class="synthetic" lang="en" dir="ltr">SYNTHETIC DEMO</span>
    </div>
  </div>
</header>
<nav id="stepper" class="stepper">
  <ol id="steps"></ol>
  <p id="step-cap" class="step-cap" aria-hidden="true"></p>
</nav>
<main id="main" class="w-narrow">
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  <div id="alert" class="status err" role="alert" hidden></div>
  <div class="card-main">
    <section id="s1" class="screen" hidden></section>
    <section id="s2" class="screen" hidden></section>
    <section id="s3" class="screen" hidden></section>
    <section id="s4" class="screen" hidden></section>
    <section id="s5" class="screen" hidden></section>
    <section id="s6" class="screen" hidden></section>
    <section id="s7" class="screen" hidden></section>
  </div>
</main>
<footer id="foot" class="foot"></footer>
<script src="vendor/qrcode-generator/qrcode.js"></script>
<script src="app.js"></script>
</body>
</html>
